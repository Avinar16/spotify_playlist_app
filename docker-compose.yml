services:
  postgres:
    image: postgres:15-alpine
    container_name: spotify_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  singbox:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: singbox
    restart: unless-stopped
    volumes:
      - ./singbox/config.json:/etc/sing-box/config.json:ro
    command: ["run", "-c", "/etc/sing-box/config.json"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spotify_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HTTPS_PROXY=http://singbox:2080
      - HTTP_PROXY=http://singbox:2080
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      singbox:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    expose:
      - "8000"
    volumes:
      - ./backend:/app
    command: python main.py

  nginx:
    image: nginx:alpine
    container_name: spotify_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "https://localhost/", "--no-check-certificate"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
