services:
  postgres:
    image: postgres:15-alpine
    container_name: spotify_db
    environment:
      POSTGRES_USER: spotify_user
      POSTGRES_PASSWORD: spotify_password
      POSTGRES_DB: spotify_playlist_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U spotify_user" ]
      interval: 10s
      timeout: 5s
      retries: 5

  singbox:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: singbox
    restart: unless-stopped
    volumes:
      - ./singbox/config.json:/etc/sing-box/config.json:ro
    command: ["run", "-c", "/etc/sing-box/config.json"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spotify_backend
    env_file:
      - .env
    environment:
      - HTTPS_PROXY=http://singbox:2080
      - HTTP_PROXY=http://singbox:2080
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      singbox:
        condition: service_started
    volumes:
      - ./backend:/app
    command: python main.py

  nginx:
    image: nginx:alpine
    container_name: spotify_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./ssl:/etc/letsencrypt/live/spotifycollab.duckdns.org:ro  # ← добавили SSL
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/" ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
